name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://saas-beaute-api.onrender.com/api' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/gestion-beaute-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-beaute-app
          path: android/app/build/outputs/apk/debug/gestion-beaute-app.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Application Mobile Salon de Beauté (APK)"
          body: |
            ### 📱 Application Android Gestion Salon de Beauté
            
            Téléchargez directement le fichier **`gestion-beaute-app.apk`** ci-dessous sur votre téléphone Android.
            
            - **Version** : 1.0.0
            - **Serveur backend** : `https://saas-beaute-api.onrender.com/api`
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/gestion-beaute-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
